<!DOCTYPE HTML>
<html lang="en">

<head>
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.name }}</title>

  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="author" content="{{ site.name }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">{% endif %}

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">
</head>

<body>
  <table class="page">
    <tr style="padding:0px">
      <td style="padding:0px">
        {{ content }}

        <table class="section">
          <tr>
            <td style="padding:0px">
              <br>
              <p style="text-align:center;font-size:small;">
                Design adapted from <a style="font-size:small;" href="https://leonidk.com">Leonid Keselman's</a> and <a style="font-size:small;" href="https://jonbarron.info">Jon Barron's</a> websites
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
